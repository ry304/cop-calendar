<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COP Eligibility Calendar — Federal Workers' Compensation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/css/tabler-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f8fa;
      --bg-tertiary: #f0f2f5;
      --text-primary: #1a1d23;
      --text-secondary: #5a6070;
      --text-tertiary: #9399a6;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.2);
      --radius-md: 8px;
      --radius-lg: 12px;
      --blue-50: #E6F1FB;
      --blue-100: #B5D4F4;
      --blue-600: #185FA5;
      --blue-800: #0C447C;
      --blue-900: #042C53;
      --green-50: #EAF3DE;
      --green-100: #C0DD97;
      --green-600: #3B6D11;
      --green-800: #27500A;
      --amber-50: #FAEEDA;
      --amber-100: #FAC775;
      --amber-600: #854F0B;
      --amber-800: #633806;
      --red-50: #FCEBEB;
      --red-100: #F7C1C1;
      --red-600: #A32D2D;
      --red-800: #791F1F;
      --coral-100: #F5C4B3;
      --coral-600: #993C1D;
      --coral-800: #4A1B0C;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1d23;
        --bg-secondary: #22262e;
        --bg-tertiary: #2a2e38;
        --text-primary: #f0f2f5;
        --text-secondary: #9399a6;
        --text-tertiary: #5a6070;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.18);
        --blue-50: #0c2a4a;
        --blue-100: #0c447c;
        --blue-600: #85B7EB;
        --blue-800: #B5D4F4;
        --blue-900: #E6F1FB;
        --green-50: #152a08;
        --green-100: #27500A;
        --green-600: #97C459;
        --green-800: #C0DD97;
        --amber-50: #2e1d06;
        --amber-100: #633806;
        --amber-600: #EF9F27;
        --amber-800: #FAC775;
        --red-50: #2d1010;
        --red-100: #791F1F;
        --red-600: #F09595;
        --red-800: #F7C1C1;
        --coral-100: #4A1B0C;
        --coral-600: #F0997B;
        --coral-800: #F5C4B3;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .title-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .title-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blue-50);
      border: 0.5px solid var(--blue-100);
      border-radius: var(--radius-md);
    }

    .title-icon i { font-size: 20px; color: var(--blue-600); }

    .title-card h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .title-card p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      .input-row { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 520px) {
      .input-row { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .field input[type="date"] {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .field input[type="date"]:focus {
      box-shadow: 0 0 0 3px rgba(55,138,221,0.2);
      border-color: #378ADD;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      border: 0.5px solid transparent;
    }

    .badge i { font-size: 14px; }
    .badge-blue  { background: var(--blue-50);  color: var(--blue-800);  border-color: var(--blue-100); }
    .badge-green { background: var(--green-50); color: var(--green-800); border-color: var(--green-100); }
    .badge-amber { background: var(--amber-50); color: var(--amber-800); border-color: var(--amber-100); }
    .badge-red   { background: var(--red-50);   color: var(--red-800);   border-color: var(--red-100); }

    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 16px;
    }

    .alert i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .alert-warning { background: var(--amber-50); color: var(--amber-800); border-left: 3px solid var(--amber-100); }
    .alert-error   { background: var(--red-50);   color: var(--red-800);   border-left: 3px solid var(--red-100); }

    /* Calendar */
    .months-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .month-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 3px;
    }

    .grid-header span {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day {
      min-height: 52px;
      padding: 6px 5px 4px;
      border-radius: 6px;
      border: 0.5px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .day.empty { background: transparent; }
    .day.normal { background: var(--bg-secondary); border-color: var(--border); }

    .day.injury       { background: var(--blue-50);   border-color: var(--blue-100); }
    .day.first-loss   { background: var(--green-50);  border-color: var(--green-100); }
    .day.cop          { background: var(--amber-50);  border-color: var(--amber-100); }
    .day.deadline-30  { background: var(--red-50);    border-color: var(--red-100); }
    .day.deadline-45  { background: var(--coral-100); border-color: var(--coral-600); }

    .day .dn {
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-primary);
    }

    .day.injury .dn      { color: var(--blue-800); }
    .day.first-loss .dn  { color: var(--green-800); }
    .day.cop .dn         { color: var(--amber-800); }
    .day.deadline-30 .dn { color: var(--red-800); }
    .day.deadline-45 .dn { color: var(--coral-800); }

    .pip {
      font-size: 9px;
      font-weight: 600;
      margin-top: 3px;
      line-height: 1.2;
    }

    .pip-blue   { color: var(--blue-600); }
    .pip-green  { color: var(--green-600); }
    .pip-amber  { color: var(--amber-600); }
    .pip-red    { color: var(--red-600); }
    .pip-coral  { color: var(--coral-600); }

    /* Legend */
    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 520px) {
      .legend { grid-template-columns: repeat(2, 1fr); }
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .leg-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      height: 38px;
      padding: 0 18px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--bg-secondary); }
    .btn:active { transform: scale(0.98); }
    .btn i { font-size: 16px; }

    .btn-primary {
      background: var(--blue-900);
      color: #fff;
      border-color: var(--blue-900);
    }

    .btn-primary:hover { background: var(--blue-800); }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-tertiary);
      font-size: 14px;
      border: 0.5px dashed var(--border-md);
      border-radius: var(--radius-lg);
    }

    .empty-state i { font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.4; }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 20px;
    }
  </style>
</head>
<body>

<main class="container">

  <!-- Title Card -->
  <div class="card title-card">
    <div class="title-icon">
      <i class="ti ti-clipboard-heart" aria-hidden="true"></i>
    </div>
    <div>
      <h1>COP Eligibility Calendar</h1>
      <p>Federal Workers' Compensation — Continuation of Pay Tracker</p>
    </div>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="card-title">Enter Case Dates</div>
    <div class="input-row">
      <div class="field">
        <label for="doi">Date of Injury</label>
        <input type="date" id="doi" />
      </div>
      <div class="field">
        <label for="dcf">Date Claim Filed</label>
        <input type="date" id="dcf" />
      </div>
      <div class="field">
        <label for="ftl">First Date of Time Loss</label>
        <input type="date" id="ftl" />
      </div>
    </div>
  </div>

  <!-- Summary Badges -->
  <div id="badges-area"></div>

  <!-- Alerts -->
  <div id="alert-area"></div>

  <!-- Calendar -->
  <div id="cal-card"></div>

</main>

<footer>COP Eligibility Calendar &mdash; For internal case management use only</footer>

<script>
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function parseDate(str) {
    if (!str) return null;
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(d, n) {
    const r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }

  function sameDay(a, b) {
    return a && b &&
      a.getFullYear() === b.getFullYear() &&
      a.getMonth()    === b.getMonth()    &&
      a.getDate()     === b.getDate();
  }

  function fmtDate(d) {
    if (!d) return '—';
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  function inRange(d, a, b) {
    return d && a && b && d >= a && d <= b;
  }

  function compute() {
    const doi = parseDate(document.getElementById('doi').value);
    const ftl = parseDate(document.getElementById('ftl').value);
    const dcf = parseDate(document.getElementById('dcf').value);

    const badgesArea = document.getElementById('badges-area');
    const alertArea  = document.getElementById('alert-area');
    const calCard    = document.getElementById('cal-card');

    badgesArea.innerHTML = '';
    alertArea.innerHTML  = '';
    calCard.innerHTML    = '';

    if (!doi) return;

    const d30 = addDays(doi, 29);
    const d45 = addDays(doi, 44);

    let timeLossEligible = false, copStart = null, copEnd = null;

    if (ftl) {
      const diff = Math.round((ftl - doi) / 86400000);
      if (diff < 0) {
        alertArea.innerHTML = `<div class="alert alert-error"><i class="ti ti-alert-triangle"></i>Time-loss date is before the injury date. Please check the dates.</div>`;
        return;
      }
      if (diff <= 44) {
        timeLossEligible = true;
        copStart = ftl;
        copEnd   = addDays(ftl, 44);
      }
    }

    let claimFiledLate = false;
    if (dcf) {
      const diffClaim = Math.round((dcf - doi) / 86400000);
      if (diffClaim < 0) {
        alertArea.innerHTML = `<div class="alert alert-error"><i class="ti ti-alert-triangle"></i>Claim filed date is before the injury date. Please check the dates.</div>`;
        return;
      }
      claimFiledLate = diffClaim > 29;
    }

    const eligible = timeLossEligible && !claimFiledLate;

    // Badges
    let badgesHTML = `<div class="card"><div class="badges">`;
    badgesHTML += `<span class="badge badge-blue"><i class="ti ti-bandage"></i>Injury: ${fmtDate(doi)}</span>`;
    if (!dcf) {
      badgesHTML += `<span class="badge badge-red"><i class="ti ti-calendar-x"></i>30 Day Filing Deadline: ${fmtDate(d30)}</span>`;
    }
    if (!ftl) {
      badgesHTML += `<span class="badge badge-red"><i class="ti ti-calendar-x"></i>45 Day Time-Loss Deadline: ${fmtDate(d45)}</span>`;
    }
    if (dcf) {
      if (claimFiledLate) {
        badgesHTML += `<span class="badge badge-red"><i class="ti ti-file-x"></i>Claim filed: ${fmtDate(dcf)} (late)</span>`;
      } else {
        badgesHTML += `<span class="badge badge-green"><i class="ti ti-file-check"></i>Claim filed: ${fmtDate(dcf)}</span>`;
      }
    }
    if (ftl) {
      badgesHTML += `<span class="badge badge-green"><i class="ti ti-clock"></i>First time loss: ${fmtDate(ftl)}</span>`;
      if (eligible) {
        badgesHTML += `<span class="badge badge-green"><i class="ti ti-check"></i>COP eligible — 45 days from ${fmtDate(ftl)}</span>`;
      } else {
        badgesHTML += `<span class="badge badge-red"><i class="ti ti-x"></i>NOT eligible for COP</span>`;
      }
    }
    badgesHTML += `</div></div>`;
    badgesArea.innerHTML = badgesHTML;

    if (ftl && !timeLossEligible) {
      alertArea.innerHTML = `<div class="alert alert-warning"><i class="ti ti-alert-triangle"></i>Time loss did not begin within 45 days of injury. Employee is not eligible for COP.</div>`;
    }

    if (claimFiledLate) {
      alertArea.innerHTML += `<div class="alert alert-warning"><i class="ti ti-alert-triangle"></i>Claim was not filed within 30 days of injury. Employee is not eligible for COP.</div>`;
    }

    // Build calendar months
    const calStart  = new Date(doi.getFullYear(), doi.getMonth(), 1);
    const endDate   = copEnd ? copEnd : d45;
    const calEndDate= new Date(endDate.getFullYear(), endDate.getMonth() + 1, 0);

    const months = [];
    let cur = new Date(calStart);
    while (cur <= calEndDate) {
      months.push(new Date(cur.getFullYear(), cur.getMonth(), 1));
      cur.setMonth(cur.getMonth() + 1);
    }

    let html = `<div class="card">`;

    html += `<div class="months-container">`;

    months.forEach(mStart => {
      const mEnd = new Date(mStart.getFullYear(), mStart.getMonth() + 1, 0);
      html += `<div>`;
      html += `<div class="month-title">${MONTHS[mStart.getMonth()]} ${mStart.getFullYear()}</div>`;
      html += `<div class="grid-header">`;
      DAYS.forEach(d => html += `<span>${d}</span>`);
      html += `</div><div class="cal-grid">`;

      const firstDow = mStart.getDay();
      for (let i = 0; i < firstDow; i++) html += `<div class="day empty"></div>`;

      for (let d = 1; d <= mEnd.getDate(); d++) {
        const dt = new Date(mStart.getFullYear(), mStart.getMonth(), d);
        let cls = 'normal', pips = [];

        if (sameDay(dt, doi)) {
          cls = 'injury'; pips.push('<span class="pip pip-blue">Injury</span>');
        } else if (sameDay(dt, d30) && !dcf) {
          cls = 'deadline-30'; pips.push('<span class="pip pip-red">Day 30</span>');
        } else if (sameDay(dt, d45) && !ftl) {
          cls = 'deadline-45'; pips.push('<span class="pip pip-coral">Day 45</span>');
        } else if (ftl && sameDay(dt, ftl)) {
          cls = 'first-loss'; pips.push('<span class="pip pip-green">First loss</span>');
        } else if (copStart && copEnd && inRange(dt, copStart, copEnd)) {
          cls = 'cop'; pips.push('<span class="pip pip-amber">COP</span>');
        }

        html += `<div class="day ${cls}">
          <span class="dn">${d}</span>${pips.join('')}
        </div>`;
      }

      html += `</div></div>`;
    });

    html += `</div>`;

    // Legend
    html += `<div class="legend" style="margin-top:20px">
      <div class="leg-item"><div class="leg-swatch" style="background:var(--blue-50);border:0.5px solid var(--blue-100)"></div>Date of injury</div>
      <div class="leg-item"><div class="leg-swatch" style="background:var(--green-50);border:0.5px solid var(--green-100)"></div>First time loss</div>
      <div class="leg-item"><div class="leg-swatch" style="background:var(--amber-50);border:0.5px solid var(--amber-100)"></div>COP period (45 days)</div>
      <div class="leg-item"><div class="leg-swatch" style="background:var(--red-50);border:0.5px solid var(--red-100)"></div>Day 30 filing deadline</div>
      <div class="leg-item"><div class="leg-swatch" style="background:var(--coral-100);border:0.5px solid var(--coral-600)"></div>Day 45 time-loss deadline</div>
    </div>`;

    // Actions
    html += `<div class="actions" style="margin-top:20px">
      <button class="btn btn-primary" onclick="exportPDF()"><i class="ti ti-download"></i>Export to PDF</button>
      <button class="btn" onclick="clearAll()"><i class="ti ti-refresh"></i>Clear</button>
    </div>`;

    html += `</div>`;
    calCard.innerHTML = html;
  }

  function clearAll() {
    document.getElementById('doi').value = '';
    document.getElementById('ftl').value = '';
    document.getElementById('badges-area').innerHTML = '';
    document.getElementById('alert-area').innerHTML  = '';
    document.getElementById('cal-card').innerHTML    = '';
  }

  function exportPDF() {
    const doi = parseDate(document.getElementById('doi').value);
    const ftl = parseDate(document.getElementById('ftl').value);
    const dcf = parseDate(document.getElementById('dcf').value);
    if (!doi) { alert('Please enter a date of injury first.'); return; }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = margin;

    // Header
    doc.setFillColor(4, 44, 83);
    doc.rect(0, 0, W, 54, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16); doc.setFont('helvetica', 'bold');
    doc.text('COP Eligibility Calendar', margin, 34);
    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.text("Federal Workers' Compensation — Continuation of Pay", margin, 47);
    y = 72;

    const d30 = addDays(doi, 29);
    const d45 = addDays(doi, 44);
    let copStart = null, copEnd = null, timeLossEligible = false;
    if (ftl) {
      const diff = Math.round((ftl - doi) / 86400000);
      if (diff >= 0 && diff <= 44) { timeLossEligible = true; copStart = ftl; copEnd = addDays(ftl, 44); }
    }

    let claimFiledLate = false;
    if (dcf) {
      const diffClaim = Math.round((dcf - doi) / 86400000);
      claimFiledLate = diffClaim > 29;
    }

    const eligible = timeLossEligible && !claimFiledLate;

    // Summary boxes
    const infos = [
      ['Date of Injury', fmtDate(doi), [182, 212, 244], [12, 68, 124]],
      !dcf ? ['Day 30 Filing Deadline', fmtDate(d30), [247, 193, 193], [121, 31, 31]] : null,
      !ftl ? ['Day 45 Time-Loss Deadline', fmtDate(d45), [240, 153, 123], [74, 27, 12]] : null,
      dcf ? ['Date Claim Filed', fmtDate(dcf) + (claimFiledLate ? ' (late)' : ''),
        claimFiledLate ? [247, 193, 193] : [192, 221, 151],
        claimFiledLate ? [121, 31, 31]   : [39, 80, 10]] : null,
      ftl ? ['First Date of Time Loss', fmtDate(ftl), [192, 221, 151], [39, 80, 10]] : null,
      (ftl || dcf) ? ['COP Status', eligible ? 'ELIGIBLE — 45 days from ' + fmtDate(ftl) : 'NOT ELIGIBLE',
        eligible ? [192, 221, 151] : [247, 193, 193],
        eligible ? [39, 80, 10]   : [121, 31, 31]] : null,
    ].filter(Boolean);

    const bW = (W - margin * 2 - 10) / 2;
    infos.forEach((item, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const bx  = margin + col * (bW + 10);
      const by  = y + row * 34;
      doc.setFillColor(...item[2]);
      doc.roundedRect(bx, by, bW, 28, 3, 3, 'F');
      doc.setTextColor(120, 130, 140); doc.setFontSize(8); doc.setFont('helvetica', 'normal');
      doc.text(item[0].toUpperCase(), bx + 8, by + 11);
      doc.setTextColor(...item[3]); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
      doc.text(item[1], bx + 8, by + 22);
    });

    y += Math.ceil(infos.length / 2) * 34 + 16;

    // Calendar months
    const DAYS_S   = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const MONTHS_S = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const calStart   = new Date(doi.getFullYear(), doi.getMonth(), 1);
    const endDate    = copEnd ? copEnd : d45;
    const calEndDate = new Date(endDate.getFullYear(), endDate.getMonth() + 1, 0);
    const months = [];
    let cur = new Date(calStart);
    while (cur <= calEndDate) { months.push(new Date(cur.getFullYear(), cur.getMonth(), 1)); cur.setMonth(cur.getMonth() + 1); }

    const mPerRow = 2;
    const mW = (W - margin * 2 - 10) / mPerRow;
    const cellH = 16;

    months.forEach((mStart, mi) => {
      const col = mi % mPerRow;
      if (col === 0 && mi > 0) y += estimateMonthHeight(mStart) + 18;
      if (y + estimateMonthHeight(mStart) > H - margin - 40 && mi > 0) { doc.addPage(); y = margin; }

      const mx = margin + col * (mW + 10);
      const my = y;

      doc.setFillColor(230, 241, 251);
      doc.roundedRect(mx, my, mW, 18, 3, 3, 'F');
      doc.setTextColor(12, 68, 124); doc.setFontSize(10); doc.setFont('helvetica', 'bold');
      doc.text(MONTHS_S[mStart.getMonth()] + ' ' + mStart.getFullYear(), mx + 6, my + 12);

      DAYS_S.forEach((d, i) => {
        const dW = mW / 7;
        doc.setFontSize(7); doc.setTextColor(140, 150, 160); doc.setFont('helvetica', 'bold');
        doc.text(d, mx + i * dW + dW / 2, my + 28, { align: 'center' });
      });

      const mEnd = new Date(mStart.getFullYear(), mStart.getMonth() + 1, 0);
      let dx = mStart.getDay();
      let dy = my + 32;
      const dW = mW / 7;

      for (let d = 1; d <= mEnd.getDate(); d++) {
        const dt = new Date(mStart.getFullYear(), mStart.getMonth(), d);
        const cx = mx + dx * dW;
        let fill = null, textColor = [60, 60, 60], label = null;

        if (sameDay(dt, doi))              { fill = [182, 212, 244]; textColor = [12, 68, 124];  label = 'INJ'; }
        else if (sameDay(dt, d30) && !dcf) { fill = [247, 193, 193]; textColor = [121, 31, 31];  label = 'D30'; }
        else if (sameDay(dt, d45) && !ftl) { fill = [240, 153, 123]; textColor = [74, 27, 12];   label = 'D45'; }
        else if (ftl && sameDay(dt, ftl))  { fill = [192, 221, 151]; textColor = [39, 80, 10];   label = 'FTL'; }
        else if (copStart && copEnd && inRange(dt, copStart, copEnd)) { fill = [250, 199, 117]; textColor = [99, 56, 6]; }

        if (fill) { doc.setFillColor(...fill); doc.rect(cx + 1, dy, dW - 2, cellH - 1, 'F'); }

        doc.setTextColor(...textColor);
        doc.setFontSize(7); doc.setFont('helvetica', fill ? 'bold' : 'normal');
        doc.text(String(d), cx + dW / 2, dy + 7, { align: 'center' });
        if (label) { doc.setFontSize(5); doc.text(label, cx + dW / 2, dy + 12, { align: 'center' }); }

        dx++;
        if (dx === 7) { dx = 0; dy += cellH; }
      }
    });

    // Legend
    const lastMi = months.length - 1;
    const lastCol = lastMi % mPerRow;
    if (lastCol === 0) y += estimateMonthHeight(months[lastMi]) + 18;
    y += estimateMonthHeight(months[lastMi]) + 24;

    if (y > H - 60) { doc.addPage(); y = margin; }

    const legItems = [
      [[182, 212, 244], 'Date of injury'],
      [[192, 221, 151], 'First date of time loss'],
      [[250, 199, 117], 'COP period (45 days)'],
      [[247, 193, 193], 'Day 30 filing deadline'],
      [[240, 153, 123], 'Day 45 time-loss deadline'],
    ];

    const lW = (W - margin * 2) / legItems.length;
    legItems.forEach((item, i) => {
      const lx = margin + i * lW;
      doc.setFillColor(...item[0]); doc.rect(lx, y, 10, 10, 'F');
      doc.setTextColor(80, 80, 80); doc.setFontSize(7); doc.setFont('helvetica', 'normal');
      doc.text(item[1], lx + 13, y + 8);
    });

    y += 22;
    doc.setFontSize(8); doc.setTextColor(160, 160, 160);
    doc.text(
      'Generated ' + new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + ' — For internal case management use only.',
      margin, y
    );

    const fname = `COP_Calendar_${doi.getFullYear()}${String(doi.getMonth()+1).padStart(2,'0')}${String(doi.getDate()).padStart(2,'0')}.pdf`;
    doc.save(fname);
  }

  function estimateMonthHeight(mStart) {
    const mEnd = new Date(mStart.getFullYear(), mStart.getMonth() + 1, 0);
    const firstDow = mStart.getDay();
    const totalCells = firstDow + mEnd.getDate();
    const rows = Math.ceil(totalCells / 7);
    return 18 + 16 + rows * 16 + 4;
  }

  document.getElementById('doi').addEventListener('change', compute);
  document.getElementById('ftl').addEventListener('change', compute);
  document.getElementById('dcf').addEventListener('change', compute);
</script>

</body>
</html>
